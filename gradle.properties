# Memory for the Minecraft decompile/setup. Daemon off to avoid stale-JDK daemons.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# NOTE: deliberately no `org.gradle.java.home`. The sibling MCA add-on repos pin an absolute
# Linux JDK path here, which makes them unbuildable on other machines (spec 36.5 flags exactly
# that). Set JAVA_HOME to a JDK 17 instead, or let the foojay toolchain resolver provision one:
# ForgeGradle 6 does not tolerate JDK 21+ as the Gradle JVM.

## Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Dependencies
# MCA Reborn for 1.20.1 Forge, via Modrinth Maven (accepts the version string directly).
#
# This is the RUNTIME MCA for runClient/runServer only — nothing compiles against it (build.gradle
# declares it runtimeOnly). Override on the command line to exercise the other package root:
#   ./gradlew runServer -Pmca_version=7.6.20+1.20.1
#
# Phase 0 verified with `javap` that every signature this mod consumes is byte-identical across
# 7.6.20, 7.7.0-beta.2 and 7.7.1-alpha.2 — Village#{getId,getName,getCenter,getResidents(ServerLevel),
# getResidentsUUIDs,getResidentNames,isWithinBorder} and VillageManager#{get,getOrEmpty,
# findNearestVillage}. That reasoning still holds, but its old conclusion — "so no reflection or
# version branch is needed" — was wrong, and 0.2.0 crashed servers because of it: MCA renamed its
# base package from net.mca to net.conczin.mca in 7.7.1-alpha.2, moving the Forgix-relocated Forge
# root from forge.net.mca.* to forge.net.conczin.mca.*. Signatures were never the risk; NAMES were.
# Every MCA class and method is now resolved by name at runtime in compat/McaReflect.
mca_version=7.7.1-alpha.2+1.20.1
# Runtime MCA range accepted by mods.toml.
mca_version_range=[7.6,8)
# NOTE: Architectury is deliberately absent. MCA 7.6 pulls it in itself and 7.7 dropped it;
# this mod contains no Architectury reference of any kind (spec 9.1).

