# Memory for the NeoForm decompile/setup. Daemon off to avoid stale-JDK daemons.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# NOTE: deliberately no `org.gradle.java.home`. The sibling MCA add-on repos pin an absolute
# Linux JDK path here, which makes them unbuildable on other machines (spec 36.5 flags exactly
# that). Minecraft 1.21.1 requires JDK 21; the system JDK on this box is still 17, so the foojay
# toolchain resolver provisions 21 rather than using JAVA_HOME.

## Minecraft / NeoForge
minecraft_version=1.21.1
# Bounded to 1.21.1 / the 21.1 NeoForge line on purpose: the payload stream codecs, the
# SavedData lookup-aware signatures and the MCA 1.21.1 dependency are all 1.21.1-specific, and
# the `mca [7.7,8)` range does not constrain the Minecraft version on its own.
minecraft_version_range=[1.21.1,1.21.2)
neoforge_version=21.1.249
# Bounded above at 21.2 so the artifact can never be loaded on a 1.21.2+ game. The lower bound
# is the version this is built against; MCA: Quests accepts [21.1.0,21.2) and MCA: Conversations
# [21.1.234,21.2), so 21.1.249 sits inside both and all three mods co-install.
neoforge_version_range=[21.1.249,21.2)
loader_version_range=[4,)

# Parchment parameter names. Matches what MCA 1.21.1 and both sibling mods build against.
parchment_minecraft=1.21.1
parchment_version=2024.11.17

## Dependencies
# MCA Reborn for 1.21.1 NeoForge, from the official Conczin Maven. EXACT pin, never a range:
# this is the artifact the binary is compiled and verified against.
#
# The loader is in the artifact id (mca-neoforge), so unlike the Modrinth Maven there is no
# Fabric/NeoForge ambiguity to disambiguate with a file id. (MCA: Quests hit exactly that trap
# and had to pin Modrinth file id YKhJZ85x to avoid resolving the Fabric jar.)
#
# NOTE 7.7.36+1.21.1 was never published; -beta.3 is the real latest, and it is what MCA:
# Conversations is built and tested against. The newest non-prerelease is 7.7.33+1.21.1.
mca_version=7.7.36-beta.3+1.21.1
# Runtime MCA range accepted by neoforge.mods.toml. Deliberately WIDER than the compile pin, and
# wider than Conversations' [7.7.36-beta.3,7.7.37): every MCA call in this mod goes through
# compat/McaCompat, which is instanceof-guarded and catch(Throwable) on every path, so a
# signature that moves inside the 7.7 line degrades a feature instead of crashing a server.
# A narrow range here would instead make Reputation and Quests ([7.7,8)) mutually uninstallable.
mca_version_range=[7.7,8)
# NOTE: Architectury is deliberately absent. MCA's 1.21.1 NeoForge artifact does not use it at
# all, and this mod contains no Architectury reference of any kind (spec 9.1).

## Mod metadata
mod_id=mcareputation
mod_name=MCA: Reputation
# GPL-3.0 to match MCA Reborn, whose internals this mod links against. See the LICENSE file.
mod_license=GPL-3.0-only
# Unchanged by the 1.21.1/NeoForge port. 0.1.0 was never published and 0.2.0 is still the first
# intended release; the platform is carried by the artifact's MC/loader targeting, not by the
# mod's own version number.
mod_version=0.2.0
mod_group_id=dev.otectus.mcareputation
mod_authors=otectus
# NOTE: non-ASCII must be written as a \uXXXX escape. Gradle reads this file with the Java
# Properties charset (ISO-8859-1), so a literal UTF-8 character here arrives as mojibake and is
# written into neoforge.mods.toml as invalid UTF-8 - which NightConfig refuses to parse, and FML
# then reports as "not a valid mod file". Keep this description pure ASCII.
mod_description=Public standing with MCA villages: your deeds become stories, and those stories shape how the village treats you.
