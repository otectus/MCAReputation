# Memory for the Minecraft decompile/setup. Daemon off to avoid stale-JDK daemons.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# NOTE: deliberately no `org.gradle.java.home`. The sibling MCA add-on repos pin an absolute
# Linux JDK path here, which makes them unbuildable on other machines (spec 36.5 flags exactly
# that). Set JAVA_HOME to a JDK 17 instead, or let the foojay toolchain resolver provision one:
# ForgeGradle 6 does not tolerate JDK 21+ as the Gradle JVM.

## Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Dependencies
# MCA Reborn for 1.20.1 Forge, via Modrinth Maven (accepts the version string directly).
# EXACT pin, never a range: this is the artifact the binary is compiled and tested against.
# The compiled binary also runs on MCA 7.6 (see the mods.toml range). Phase 0 verified with
# `javap` against both deobf jars that every signature this mod consumes is byte-identical
# across 7.6.20 and 7.7.0-beta.2 — Village#{getId,getName,getCenter,getResidents(ServerLevel),
# getResidentsUUIDs,getResidentNames,isWithinBorder} and VillageManager#{get,getOrEmpty,
# findNearestVillage} — so no reflection or version branch is needed. The one known 7.6->7.7
# drift (Personality enum -> registry class) is consumed only through Object#toString().
mca_version=7.7.0-beta.2+1.20.1
# Runtime MCA range accepted by mods.toml.
mca_version_range=[7.6,8)
# NOTE: Architectury is deliberately absent. MCA 7.6 pulls it in itself and 7.7 dropped it;
# this mod contains no Architectury reference of any kind (spec 9.1).

## Mod metadata
mod_id=mcareputation
mod_name=MCA: Reputation
# GPL-3.0 to match MCA Reborn, whose internals this mod links against. See the LICENSE file.
mod_license=GPL-3.0-only
mod_version=0.2.0
mod_group_id=dev.otectus.mcareputation
mod_authors=otectus
mod_description=Public standing with MCA villages: your deeds become stories, and those stories shape how the village treats you.
