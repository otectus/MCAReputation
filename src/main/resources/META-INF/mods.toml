modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# No [[mixins]] block: this mod ships none. The one place a mixin was a candidate — putting a
# "Standing" button on MCA's InteractScreen — is done through Forge's ScreenEvent.Init.Post
# instead, so there is no MCA-internal signature to drift against (spec 11: mixins are a last
# resort).

# MCA: Reputation is meaningless without MCA Reborn, so MCA is a mandatory dependency. We load
# AFTER MCA so its entities, village manager, and saved data are present.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mca"
    mandatory=true
    versionRange="${mca_version_range}"
    ordering="AFTER"
    side="BOTH"
# NOTE: Architectury is deliberately NOT declared. MCA 7.6 requires it and declares that itself;
# MCA 7.7 dropped the dependency entirely. This mod has zero Architectury references, so declaring
# it would only block 7.7 users who removed it (spec 9.1).

# MCA: Quests, MCA: Conversations, and MCA: Crime are OPTIONAL. Reputation is fully playable without either and
# never compiles against them; the ordering only matters so that, when they ARE present, their own
# optional Reputation bridges see a fully initialised Reputation. Both siblings additionally declare
# `mcareputation` optional + AFTER on their side, which is what actually orders their bridge setup;
# these entries exist so the dependency graph reads correctly from either direction.
[[dependencies.${mod_id}]]
    modId="mcaquests"
    mandatory=false
    versionRange="[1.0,)"
    ordering="BEFORE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mcaconversations"
    mandatory=false
    versionRange="[1.0,)"
    ordering="BEFORE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mcacrime"
    mandatory=false
    versionRange="[0.1,)"
    ordering="BEFORE"
    side="BOTH"
