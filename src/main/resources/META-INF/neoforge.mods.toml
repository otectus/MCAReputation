modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# No [[mixins]] block: this mod ships none. The one place a mixin was a candidate - putting a
# "Standing" button on MCA's InteractScreen - is done through NeoForge's ScreenEvent.Init.Post
# instead, so there is no MCA-internal signature to drift against (spec 11: mixins are a last
# resort). checkJarContents fails the build if a mixin config ever appears in the artifact.

# MCA: Reputation is meaningless without MCA Reborn, so MCA is a mandatory dependency. We load
# AFTER MCA so its entities, village manager, and saved data are present.
#
# The MCA range is deliberately WIDE, and wider than the exact artifact this is compiled against
# (see mca_version in gradle.properties). Every MCA access goes through compat/McaCompat, which is
# instanceof-guarded and catch(Throwable) on every path, so a signature that moves inside the 7.7
# line degrades one feature rather than crashing a server. A narrow range would instead make this
# mod and MCA: Quests mutually uninstallable, since they are verified against different 7.7 builds.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mca"
    type="required"
    versionRange="${mca_version_range}"
    ordering="AFTER"
    side="BOTH"
# NOTE: Architectury is deliberately NOT declared. MCA's 1.21.1 NeoForge artifact does not use it
# at all, and this mod has zero Architectury references, so declaring it would only block users
# who do not have it installed (spec 9.1).

# MCA: Quests, MCA: Conversations, and MCA: Crime are OPTIONAL. Reputation is fully playable
# without any of them and never compiles against them; the ordering only matters so that, when
# they ARE present, their own optional Reputation bridges see a fully initialised Reputation.
# Each sibling additionally declares `mcareputation` optional + AFTER on its side, which is what
# actually orders their bridge setup; these entries exist so the dependency graph reads correctly
# from either direction. Their absence must never block startup.
#
# The integration features these enable require the 1.21.1 NeoForge ports of those mods; a Forge
# 1.20.1 jar cannot load here at all, so the ranges below never admit one in practice.
[[dependencies.${mod_id}]]
    modId="mcaquests"
    type="optional"
    versionRange="[1.0,)"
    ordering="BEFORE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mcaconversations"
    type="optional"
    versionRange="[1.0,)"
    ordering="BEFORE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mcacrime"
    type="optional"
    versionRange="[0.1,)"
    ordering="BEFORE"
    side="BOTH"
