plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.5+ requires Java 21; the foojay resolver provisions it if the system JDK is older.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // The test suite is not purely JVM-side: it touches ResourceLocation, Component,
    // RegistryFriendlyByteBuf, Brigadier and NBT, so it needs real Minecraft classes on the
    // test classpath. Do not remove this just because most domain tests look pure.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    // MCA Reborn. The loader is in the artifact id (mca-neoforge), so there is no
    // Fabric/NeoForge ambiguity here. Scoped so nothing else resolves through it.
    maven {
        name = 'Conczin'
        url = 'https://maven.conczin.net/Artifacts'
        content { includeGroup 'net.conczin.mca' }
    }
}

dependencies {
    // MCA Reborn - a mojmap NeoForge mod jar, so it loads as a real mod under runClient/runServer.
    // (On 1.20.1 it could not: MCA shipped a Forgix-merged universal jar and needed fg.deobf.)
    //
    // transitive = false on purpose: MCA's POM declares runtime dependencies on
    // maven.modrinth:sodium and maven.modrinth:ferrite-core, which do not resolve without the
    // Modrinth Maven. Nothing this mod needs is lost.
    //
    // Every MCA access is isolated behind dev.otectus.mcareputation.compat (spec 11).
    //
    // NOTE: no Architectury dependency, deliberately (spec 9.1). MCA 1.21.1 dropped it entirely
    // and this mod contains no Architectury reference of any kind.
    implementation("net.conczin.mca:mca-neoforge:${mca_version}") {
        transitive = false
    }

    // Unit tests for the pure (non-MCA) domain: score math, decay, awareness, codecs, NBT round
    // trips, tiers, pruning, migration - plus the port's payload and saved-data compatibility tests.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    // ModDevGradle's unitTest runner works out of build/minecraft-junit, so the tests that read
    // the real shipped resources off disk (ContentValidationTest, LangParityTest,
    // OptionalClassloadTest, NeoForgePortLintTest) cannot reach src/ through a relative path.
    systemProperty 'mcareputation.projectRoot', project.projectDir.absolutePath

    // The exact MCA artifact this build compiled against, for McaBinaryAbiTest. Resolved lazily so a
    // checkout that cannot reach the Conczin Maven still runs every other test: the property is then
    // absent and the ABI audit disables itself rather than failing.
    systemProperty 'mcareputation.mcaJar', providers.provider { mcaJarFile()?.absolutePath ?: '' }.get()
    // Digest of the artifact the surface in McaReflect was audited against. Empty until filled in;
    // the audit then skips the identity check rather than pinning to nothing. See gradle.properties.
    systemProperty 'mcareputation.mcaJarSha256', project.findProperty('mca_jar_sha256') ?: ''

    // Forwarded so the golden saved-data fixture can be rewritten deliberately; see
    // src/test/resources/fixtures/README.md. Absent, the regeneration test skips itself.
    systemProperty 'mcareputation.regenerateFixtures',
            System.getProperty('mcareputation.regenerateFixtures', 'false')
}

/**
 * The resolved mca-neoforge jar, or null when it cannot be resolved. Never throws: a missing artifact
 * must degrade the ABI audit, not break `test`.
 */
File mcaJarFile() {
    try {
        return configurations.compileClasspath.incoming.artifactView { view ->
            view.lenient = true
        }.artifacts.artifacts.find { artifact ->
            artifact.id.componentIdentifier.hasProperty('module')
                    ? artifact.id.componentIdentifier.module == 'mca-neoforge'
                    : false
        }?.file
    } catch (Exception ignored) {
        return null
    }
}

tasks.register('mcaJarInfo') {
    group = 'verification'
    description = 'Prints the resolved MCA jar and its SHA-256, for the mca_jar_sha256 pin.'
    doLast {
        def jar = mcaJarFile()
        if (jar == null) {
            logger.lifecycle('mcaJarInfo: mca-neoforge did not resolve on the compile classpath.')
            return
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def hex = digest.digest(jar.bytes).encodeHex().toString()
        logger.lifecycle("mcaJarInfo: path   = ${jar.absolutePath}")
        logger.lifecycle("mcaJarInfo: sha256 = ${hex}")
    }
}

// Expand metadata placeholders into neoforge.mods.toml at build time.
tasks.named('processResources', ProcessResources).configure {
    // Without this the expansion is written in the platform charset (windows-1252 here), which
    // cannot encode every character the metadata might contain and emits '?' bytes mid-sequence.
    // The result is a neoforge.mods.toml that is not valid UTF-8, and NightConfig rejects the file.
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mca_version            : mca_version,
            mca_version_range      : mca_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

/**
 * Spec 36.5 static jar check: the shipped artifact must be exactly what we intend to ship.
 *
 * Three failure modes this exists for. A dependency getting bundled: MCA and NeoForge are both on
 * the compile path, and a stray `implementation files(...)` would quietly fold their classes in,
 * producing a jar that overrides the real mod at runtime. Metadata drift: a jar carrying the old
 * Forge-spelled mods.toml loads as far as the main menu and then behaves as if the mod were not
 * installed. And a stale port: a surviving constant-pool reference to net/minecraftforge/ or the
 * Forgix-relocated forge/net/mca/ root means a mechanical port missed a file.
 *
 * The bytecode scan reads each class entry as ISO-8859-1 and searches for slash-form package
 * strings. That is not a semantic verifier, but it reliably catches stale constant-pool entries -
 * which a jar-entry-prefix check alone cannot.
 */
tasks.register('checkJarContents') {
    dependsOn tasks.named('jar')
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def expectedVersion = project.version.toString()
    inputs.file(jarFile)
    outputs.upToDateWhen { false }

    doLast {
        def problems = []
        def entries = [] as Set
        def classMajors = [] as Set
        def bytecodeHits = [:].withDefault { [] }
        String implementationVersion = null

        // Package roots that must not appear as a packaged entry NOR as a constant-pool string.
        def forbidden = ['net/conczin/mca/', 'forge/net/mca/', 'net/minecraftforge/',
                         'dev/otectus/mcaquests/', 'dev/otectus/mcaconversations/',
                         'dev/otectus/mcacrime/', 'dev/architectury/', 'me/shedaniel/',
                         'org/spongepowered/']

        new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                entries << entry.name
                if (entry.name == 'META-INF/MANIFEST.MF') {
                    zip.getInputStream(entry).withCloseable { input ->
                        implementationVersion = new java.util.jar.Manifest(input)
                                .mainAttributes.getValue('Implementation-Version')
                    }
                } else if (entry.name.endsWith('.class')) {
                    byte[] bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                    if (bytes.length >= 8) {
                        classMajors << (((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF))
                    }
                    def text = new String(bytes, 'ISO-8859-1')
                    forbidden.each { prefix ->
                        if (text.contains(prefix)) {
                            bytecodeHits[prefix] << entry.name
                        }
                    }
                }
            }
        }

        // --- required metadata ---
        // The nine GUI sprites and the seven nine-slice records the atlas reads their
        // scaling from. A sprite that ships without its .mcmeta does not fail to load: it
        // silently stretches, which looks like a layout bug and is a packaging one.
        def slicedSprites = ['panel', 'well', 'progress_track', 'progress_fill',
                             'scroll_groove', 'scroll_thumb', 'separator']
        def guiSprites = slicedSprites + ['arrow_left', 'arrow_right']
        def required = ['META-INF/neoforge.mods.toml', 'assets/mcareputation/lang/en_us.json',
                        'data/mcareputation/mcareputation/reputation_tiers/default.json',
                        'data/mcareputation/mcareputation/incidents/villager_assaulted.json',
                        'data/mcaquests/mcaquests/titles/honored_of_village.json']
        def spriteDir = 'assets/mcareputation/textures/gui/sprites/reputation/'
        // .toString() is load-bearing: a GString is never equal to the String jar entry, so
        // an interpolated name would report every sprite missing however well it packaged.
        guiSprites.each { required << "${spriteDir}${it}.png".toString() }
        slicedSprites.each { required << "${spriteDir}${it}.png.mcmeta".toString() }
        required.each {
            if (!entries.contains(it)) {
                problems << "missing ${it}"
            }
        }
        // NeoForge synthesises pack metadata for mods; a shipped 1.20.1 pack.mcmeta would be stale.
        // The 1.20.1 sprite sheet goes with them: nothing blits UVs into it any more, and shipping
        // it would leave two sources of truth for the same frame.
        ['META-INF/mods.toml', 'pack.mcmeta',
         'assets/mcareputation/textures/gui/reputation.png'].each {
            if (entries.contains(it)) {
                problems << "${it} must not be packaged (Forge-era file)"
            }
        }
        if (entries.any { it.endsWith('.mixins.json') }) {
            problems << 'a mixin config is packaged; this mod ships none by design (spec 11)'
        }

        // --- nothing shaded, and no stale platform references ---
        forbidden.each { prefix ->
            def shaded = entries.findAll { it.startsWith(prefix) && it.endsWith('.class') }
            if (!shaded.isEmpty()) {
                problems << "${shaded.size()} shaded class(es) under ${prefix}, e.g. ${shaded.first()}"
            }
        }
        // MCA is reflection-only: every MCA name lives in a string literal, so no class in the jar
        // may carry a net/conczin/mca/ constant-pool entry at all.
        def mcaAllowed = [] as Set
        bytecodeHits.each { prefix, hits ->
            def offenders = prefix == 'net/conczin/mca/'
                    ? hits.findAll { !mcaAllowed.contains(it) }
                    : hits
            if (!offenders.isEmpty()) {
                problems << "bytecode reference to ${prefix} in ${offenders.take(5)}"
            }
        }
        def nested = entries.findAll { it.endsWith('.jar') }
        if (!nested.isEmpty()) {
            problems << "nested jar(s): ${nested.join(', ')}"
        }

        // --- build identity ---
        if (implementationVersion != expectedVersion) {
            problems << "Implementation-Version is '${implementationVersion}', expected '${expectedVersion}'"
        }
        // 65 == Java 21. A stray 61 would mean something compiled against the wrong release.
        def wrong = classMajors.findAll { it != 65 }
        if (!wrong.isEmpty()) {
            problems << "class-file major version(s) ${wrong} present; Java 21 is 65"
        }

        if (!problems.isEmpty()) {
            throw new GradleException("checkJarContents failed:" + System.lineSeparator()
                    + "  - " + problems.join(System.lineSeparator() + "  - "))
        }
        logger.lifecycle("checkJarContents: ${entries.size()} entries, nothing shaded, "
                + "no Forge or relocated-MCA bytecode references, all classes Java 21.")
    }
}

tasks.named('build').configure {
    dependsOn 'checkJarContents'
}

/**
 * The compile-only API artifact, for sibling add-ons (MCA: Conversations) to compile against.
 *
 * This is a contract, not a shippable jar. It carries classes only - no resources, no metadata -
 * so a consumer that puts it on its compile classpath sees the types and nothing else. Consumers
 * must never ship these classes: at runtime the real mod jar provides them, and a duplicate copy
 * inside another mod would shadow it.
 *
 * Everything under api/ is the stable surface. The five named classes outside it (CommunityKey and
 * the incident enums/records) are exported because the api/ signatures mention them - they are a
 * read model for callers, not a stability promise, and may change with the internals.
 *
 * No reobfuscation step exists on NeoForge, so the classes here are the same mojmap classes the
 * mod jar ships. This is a plain Jar task and deliberately does not go through the `jar` task's
 * manifest or checkJarContents, both of which describe the shipped mod artifact instead.
 */
def apiExports = [
        'dev/otectus/mcareputation/api/**',
        'dev/otectus/mcareputation/community/CommunityKey.class',
        'dev/otectus/mcareputation/community/CommunityKey$*.class',
        'dev/otectus/mcareputation/incident/IncidentSeverity.class',
        'dev/otectus/mcareputation/incident/IncidentSeverity$*.class',
        'dev/otectus/mcareputation/incident/IncidentStatus.class',
        'dev/otectus/mcareputation/incident/IncidentStatus$*.class',
        'dev/otectus/mcareputation/incident/IncidentVisibility.class',
        'dev/otectus/mcareputation/incident/IncidentVisibility$*.class',
        'dev/otectus/mcareputation/incident/IncidentSubject.class',
        'dev/otectus/mcareputation/incident/IncidentSubject$*.class',
        'dev/otectus/mcareputation/incident/SubjectKind.class',
        'dev/otectus/mcareputation/incident/SubjectKind$*.class',
        // Read model (0.6.1 line): the tier and title types the public api events and lookups already
        // return (ReputationTitleGrantedEvent.scope(), ReputationTiers.getOrDefault). MCA: Quests named
        // them as internals; exporting them makes the api jar closed under its own signatures.
        'dev/otectus/mcareputation/reputation/TitleScope.class',
        'dev/otectus/mcareputation/reputation/TitleScope$*.class',
        'dev/otectus/mcareputation/reputation/ReputationTiers.class',
        'dev/otectus/mcareputation/reputation/ReputationTiers$*.class',
        'dev/otectus/mcareputation/reputation/ReputationTierSet.class',
        'dev/otectus/mcareputation/reputation/ReputationTierSet$*.class',
        'dev/otectus/mcareputation/reputation/ReputationTier.class',
        'dev/otectus/mcareputation/reputation/ReputationTier$*.class',
]

tasks.register('apiJar', Jar) {
    // Reproducible: no entry timestamps and a fixed entry order, so a rebuild from the same sources yields
    // the same bytes and the SHA-256 pins in consumers' gradle/sibling-apis.properties survive it.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    group = 'build'
    description = 'Builds the compile-only API jar for sibling add-ons.'
    dependsOn tasks.named('compileJava')

    archiveClassifier = 'api'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output.classesDirs) {
        include apiExports
    }

    manifest {
        attributes([
                'Specification-Title'   : "${mod_id}-api".toString(),
                'Specification-Version' : mod_version,
                'Implementation-Title'  : "${mod_id}-api".toString(),
        ])
    }
}

tasks.named('assemble').configure {
    dependsOn 'apiJar'
}

/**
 * Static check on the API jar: it must carry the surface, all of it, and nothing else.
 *
 * (a) something under api/ is present at all - a silently empty filter would otherwise ship an
 * artifact that compiles against nothing; (b) each named non-api export is really in there, since
 * a rename in the internals would drop it from the include list without any compile error; and
 * (c) no resource metadata leaked in, which would make the artifact look like a loadable mod.
 */
tasks.register('verifyApiJar') {
    group = 'verification'
    description = 'Checks that the API jar carries the exported classes and no resources.'
    dependsOn tasks.named('apiJar')
    def apiJarFile = tasks.named('apiJar', Jar).flatMap { it.archiveFile }
    inputs.file(apiJarFile)
    outputs.upToDateWhen { false }

    doLast {
        def requiredExports = [
                'dev/otectus/mcareputation/community/CommunityKey.class',
                'dev/otectus/mcareputation/incident/IncidentSeverity.class',
                'dev/otectus/mcareputation/incident/IncidentStatus.class',
                'dev/otectus/mcareputation/incident/IncidentVisibility.class',
                'dev/otectus/mcareputation/incident/IncidentSubject.class',
                'dev/otectus/mcareputation/incident/SubjectKind.class',
        ]
        def problems = []
        def entries = [] as Set

        new java.util.zip.ZipFile(apiJarFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry -> entries << entry.name }
        }

        if (!entries.any { it.startsWith('dev/otectus/mcareputation/api/') }) {
            problems << 'no entry under dev/otectus/mcareputation/api/; the include filter matched nothing'
        }
        requiredExports.each {
            if (!entries.contains(it)) {
                problems << "missing exported class ${it}"
            }
        }
        def resources = entries.findAll {
            it.endsWith('.json') || it.endsWith('.toml') || it.endsWith('.mcmeta')
        }
        if (!resources.isEmpty()) {
            problems << "resource file(s) packaged in a classes-only artifact: ${resources.join(', ')}"
        }

        if (!problems.isEmpty()) {
            throw new GradleException("verifyApiJar failed:" + System.lineSeparator()
                    + "  - " + problems.join(System.lineSeparator() + "  - "))
        }
        logger.lifecycle("verifyApiJar: ${entries.size()} entries, every export present, no resources.")
    }
}

/**
 * Spec 21.2's two API-artifact fixtures.
 *
 * `verifyApiJar` asserts the shape of the artifact: which entries are in it, and that it carries no
 * resources. What it cannot do is notice that an exported signature mentions a type that is NOT
 * exported - when this project compiles itself the whole implementation is on the classpath, so the
 * gap only appears in a consumer's build. These two tasks close that, from both directions:
 *
 *  - `verifyApiJarLinks` compiles an outside-style consumer against the produced api jar ALONE plus
 *    the ordinary NeoForge/Minecraft compile environment. A new signature naming an internal
 *    tracker, policy or mutable record fails here.
 *  - `verifyApiJarLinkage` compiles a consumer against the FROZEN api jar of the previous release and
 *    runs it against the current implementation classes, so a moved record component or a widened
 *    parameter shows up as the NoSuchMethodError a companion would have suffered.
 *
 * The baseline jar is rebuilt from the frozen release commit rather than vendored or taken from
 * build/libs: a checked-in binary would be a second copy of an artifact git already holds, and
 * build/libs is overwritten by the current apiJar.
 *
 * On this branch the baseline is `b70f320`, the pushed NeoForge 0.5.0 port this branch is based
 * on - NOT the Forge release the feature set came from. A Forge api jar does not link here at all
 * (the `api.event` types extend `net.neoforged.bus.api.Event`, which is why `API_VERSION` is 2 here
 * and 1 there), so compiling a Forge-era consumer against this implementation would fail for a
 * reason that has nothing to do with 0.6.0 compatibility.
 *
 * Nothing here is remapped. ModDevGradle compiles against Mojang mappings with Parchment parameter
 * names and its jar output is already the distributable artifact, so the baseline classes and the
 * current ones name the same Minecraft members and `verifyApiJarLinkage` is a real linkage check
 * rather than a mapping comparison.
 */
def apiBaselineRef = project.findProperty('apiBaselineRef') ?: 'b70f320'
def apiBaselineDir = layout.buildDirectory.dir('apiBaseline')

tasks.register('apiBaselineSources') {
    description = "Extracts the ${apiBaselineRef} main sources for the API linkage fixture."
    outputs.dir(apiBaselineDir.map { it.dir('tree') })
    outputs.upToDateWhen { apiBaselineDir.get().dir('tree/src/main/java').asFile.isDirectory() }
    onlyIf {
        def probe = new ProcessBuilder('git', 'cat-file', '-e', "${apiBaselineRef}^{commit}")
                .directory(projectDir)
                .redirectErrorStream(true)
        probe.redirectOutput(ProcessBuilder.Redirect.DISCARD)
        boolean present = probe.start().waitFor() == 0
        if (!present) {
            logger.lifecycle("apiBaselineSources: commit ${apiBaselineRef} is not in this repository; "
                    + "the API linkage fixture is skipped (override with -PapiBaselineRef=<ref>).")
        }
        present
    }
    doLast {
        def tree = apiBaselineDir.get().dir('tree').asFile
        tree.deleteDir()
        tree.mkdirs()
        def archive = new File(apiBaselineDir.get().asFile, 'baseline-src.tar')
        def export = new ProcessBuilder('git', 'archive', '--format=tar', "${apiBaselineRef}",
                'src/main/java').directory(projectDir)
        export.redirectOutput(archive)
        export.redirectErrorStream(false)
        if (export.start().waitFor() != 0) {
            throw new GradleException("git archive ${apiBaselineRef} failed")
        }
        def extract = new ProcessBuilder('tar', '-xf', archive.absolutePath, '-C', tree.absolutePath)
                .inheritIO()
        if (extract.start().waitFor() != 0) {
            throw new GradleException("extracting the ${apiBaselineRef} sources failed")
        }
    }
}

tasks.register('compileApiBaseline', JavaCompile) {
    description = "Compiles the ${apiBaselineRef} sources so its API jar can be rebuilt exactly."
    dependsOn 'apiBaselineSources'
    onlyIf { tasks.named('apiBaselineSources').get().didWork || source.files.size() > 0 }
    source = fileTree(apiBaselineDir.map { it.dir('tree/src/main/java') }) {
        include '**/*.java'
    }
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = apiBaselineDir.map { it.dir('classes') }
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('apiBaselineJar', Jar) {
    description = "The ${apiBaselineRef} compile-only API jar, rebuilt from that commit's sources."
    dependsOn 'compileApiBaseline'
    // Skipped rather than empty when the baseline commit is unavailable: an empty api jar would make
    // the linkage fixture fail with a compile error that says nothing about compatibility.
    onlyIf {
        def classes = apiBaselineDir.get().dir('classes').asFile
        classes.isDirectory() && !fileTree(classes).matching { include '**/*.class' }.isEmpty()
    }
    archiveBaseName = "${mod_id}-baseline"
    archiveClassifier = 'api'
    destinationDirectory = apiBaselineDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(apiBaselineDir.map { it.dir('classes') }) {
        include apiExports
    }
}

/**
 * The outside-consumer compile: the api jar alone, plus Forge and Minecraft. Deliberately not a
 * source set of its own - a source set would put the project's own classes on its compile classpath,
 * which is exactly the leniency this fixture exists to remove.
 */
tasks.register('compileApiJarFixture', JavaCompile) {
    description = 'Compiles a sample consumer against the produced API jar alone.'
    dependsOn 'apiJar'
    source = fileTree('src/apiFixture/java') {
        include '**/*.java'
    }
    classpath = objects.fileCollection().from(
            tasks.named('apiJar', Jar).flatMap { it.archiveFile },
            sourceSets.main.compileClasspath)
    destinationDirectory = layout.buildDirectory.dir('apiFixture/classes')
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('verifyApiJarLinks') {
    description = 'Fails when an exported API signature references a type the API jar does not carry.'
    dependsOn 'compileApiJarFixture'
    doLast {
        def classes = layout.buildDirectory.dir('apiFixture/classes').get().asFile
        def compiled = classes.isDirectory() ? fileTree(classes).matching { include '**/*.class' } : files()
        if (compiled.isEmpty()) {
            throw new GradleException('verifyApiJarLinks compiled nothing; the fixture source is missing.')
        }
        logger.lifecycle("verifyApiJarLinks: the sample consumer compiles against "
                + "${tasks.named('apiJar', Jar).get().archiveFile.get().asFile.name} alone "
                + "(${compiled.files.size()} classes).")
    }
}

tasks.register('compileApiLinkageFixture', JavaCompile) {
    description = "Compiles a ${apiBaselineRef}-era consumer against that release's API jar."
    dependsOn 'apiBaselineJar'
    // Gated on the artifact rather than on whether the jar task did work, so an incremental build
    // that finds the baseline jar up to date still recompiles a changed fixture against it.
    onlyIf {
        def jar = tasks.named('apiBaselineJar', Jar).get().archiveFile.get().asFile
        boolean usable = false
        if (jar.isFile()) {
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                usable = zip.entries().any { it.name.endsWith('.class') }
            }
        }
        if (!usable) {
            logger.lifecycle("compileApiLinkageFixture: no usable ${apiBaselineRef} API jar; "
                    + "the binary-linkage fixture is skipped.")
        }
        usable
    }
    source = fileTree('src/apiLinkage/java') {
        include '**/*.java'
    }
    classpath = objects.fileCollection().from(
            tasks.named('apiBaselineJar', Jar).flatMap { it.archiveFile },
            sourceSets.main.compileClasspath)
    destinationDirectory = layout.buildDirectory.dir('apiLinkage/classes')
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('verifyApiJarLinkage', JavaExec) {
    description = "Runs the ${apiBaselineRef}-compiled consumer against the current implementation."
    dependsOn 'compileApiLinkageFixture', 'classes'
    onlyIf {
        def classes = layout.buildDirectory.dir('apiLinkage/classes').get().asFile
        boolean compiled = classes.isDirectory()
                && !fileTree(classes).matching { include '**/*.class' }.isEmpty()
        if (!compiled) {
            logger.lifecycle('verifyApiJarLinkage: no baseline-compiled fixture; skipped.')
        }
        compiled
    }
    // The previous release's call sites, resolved against today's classes. No api jar on this
    // classpath: the point is that the implementation still satisfies what that jar promised.
    classpath = objects.fileCollection().from(
            layout.buildDirectory.dir('apiLinkage/classes'),
            sourceSets.main.output,
            sourceSets.main.runtimeClasspath)
    mainClass = 'dev.otectus.mcareputation.fixture.LegacyApiConsumer'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('verifyApiJar').configure {
    finalizedBy 'verifyApiJarLinks', 'verifyApiJarLinkage'
}

tasks.named('check').configure {
    dependsOn 'verifyApiJarLinks'
    dependsOn 'verifyApiJarLinkage'
}

tasks.named('build').configure {
    dependsOn 'verifyApiJar'
    dependsOn 'verifyApiJarLinks'
    dependsOn 'verifyApiJarLinkage'
}
