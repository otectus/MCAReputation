plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.18+ ships Java 17; target it explicitly (a modern system default JDK is 21+,
// which ForgeGradle 6 does not tolerate as the Gradle JVM).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    // MCA Reborn via Modrinth Maven. exclusiveContent keeps this repo scoped to the
    // maven.modrinth group and routes resolution through ForgeGradle's deobf pipeline.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MCA Reborn — obfuscated production (Universal) jar, remapped to our dev mappings by fg.deobf.
    //
    // runtimeOnly, NOT implementation: nothing in this mod compiles against MCA any more. MCA moves
    // its base package between releases (net.mca -> net.conczin.mca in 7.7.1), so every MCA class and
    // method is resolved by name at runtime in compat/McaReflect. Keeping MCA off the compile
    // classpath makes that a COMPILE ERROR rather than a test failure if anyone reintroduces an
    // import, while runClient/runServer still get a real MCA to load.
    //
    // NOTE: no Architectury dependency, deliberately (spec 9.1). MCA 7.6 declares it itself and
    // MCA 7.7 dropped it; this mod contains no Architectury reference of any kind.
    runtimeOnly fg.deobf("maven.modrinth:minecraft-comes-alive-reborn:${mca_version}")

    // Unit tests for the pure (non-MCA, non-Minecraft-runtime) domain: score math, decay,
    // awareness, codecs, NBT round trips, tiers, pruning, migration.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Forwarded so the golden saved-data fixture can be rewritten deliberately; see
    // src/test/resources/fixtures/README.md. Absent, the regeneration test skips itself.
    systemProperty 'mcareputation.regenerateFixtures',
            System.getProperty('mcareputation.regenerateFixtures', 'false')
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Expand metadata placeholders into mods.toml / pack.mcmeta at build time.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mca_version_range: mca_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * Spec 36.5 static jar check: the shipped artifact must not contain a single class from an
 * optional companion mod, from Architectury, or from any other mod. Reputation depends on
 * nothing but Forge and MCA, so anything under those package roots means a build-file mistake.
 */
tasks.register('checkJarContents') {
    dependsOn tasks.named('jar')
    doLast {
        // Every MCA package root, old and new. The shipped jar must contain none of them: MCA is
        // reached by name at runtime, so a class file under any of these roots means a build mistake.
        def forbidden = ['dev/otectus/mcaquests/', 'dev/otectus/mcaconversations/',
                         'dev/architectury/', 'me/shedaniel/',
                         'forge/net/mca/', 'forge/net/conczin/mca/',
                         'net/mca/', 'net/conczin/mca/']
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def offenders = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (forbidden.any { entry.name.startsWith(it) }) {
                    offenders << entry.name
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Shaded classes found in ${jarFile.name}: ${offenders.take(20)}")
        }
        logger.lifecycle("checkJarContents: ${jarFile.name} is clean (no shaded companion/Architectury/MCA classes).")
    }
}

/**
 * Compile-only API contract for sibling add-ons (MCA: Conversations).
 *
 * This jar carries classes only - never resources - so a consumer can compile against the public
 * surface without pulling in mods.toml, data, or anything else that would make it a second mod.
 * The classes outside `api/` listed in apiExports are a READ MODEL: keys and enums the API's own
 * signatures mention. They are here so those signatures resolve, not as a stability promise.
 * Consumers must never ship (shade, jar-in-jar, or otherwise bundle) any of these classes; they are
 * provided at runtime by this mod.
 *
 * Deliberately NOT reobfuscated: no reobf registration and no finalizedBy reobfJar, so the api jar
 * keeps official (Mojang) names and matches the dev-time classpath of the mods that compile on it.
 */
def apiExports = [
        'dev/otectus/mcareputation/api/**',
        'dev/otectus/mcareputation/community/CommunityKey.class',
        'dev/otectus/mcareputation/community/CommunityKey$*.class',
        'dev/otectus/mcareputation/incident/IncidentSeverity.class',
        'dev/otectus/mcareputation/incident/IncidentSeverity$*.class',
        'dev/otectus/mcareputation/incident/IncidentStatus.class',
        'dev/otectus/mcareputation/incident/IncidentStatus$*.class',
        'dev/otectus/mcareputation/incident/IncidentVisibility.class',
        'dev/otectus/mcareputation/incident/IncidentVisibility$*.class',
        'dev/otectus/mcareputation/incident/IncidentSubject.class',
        'dev/otectus/mcareputation/incident/IncidentSubject$*.class',
        'dev/otectus/mcareputation/incident/SubjectKind.class',
        'dev/otectus/mcareputation/incident/SubjectKind$*.class',
]

tasks.register('apiJar', Jar) {
    dependsOn tasks.named('compileJava')
    archiveClassifier = 'api'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output.classesDirs) {
        include apiExports
    }

    manifest {
        attributes([
                'Specification-Title'  : "${mod_id}-api",
                'Specification-Version': mod_version,
                'Implementation-Title' : "${mod_id}-api"
        ])
    }
}

tasks.named('assemble').configure {
    dependsOn 'apiJar'
}

/**
 * The api jar is easy to break silently: a renamed package empties it, and a stray `from` line
 * turns it into a second copy of the mod. Assert the shape rather than trusting the include list.
 */
tasks.register('verifyApiJar') {
    dependsOn tasks.named('apiJar')
    doLast {
        // Every export that must be present as a concrete class entry (the `api/**` wildcard is
        // checked separately, by requiring at least one entry under that root).
        def requiredClasses = apiExports.findAll { it.endsWith('.class') && !it.contains('$') }
        def jarFile = tasks.named('apiJar').get().archiveFile.get().asFile
        def names = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry -> names << entry.name }
        }

        if (!names.any { it.startsWith('dev/otectus/mcareputation/api/') }) {
            throw new GradleException("${jarFile.name} contains no dev/otectus/mcareputation/api/ entries; the API surface is missing.")
        }

        def missing = requiredClasses.findAll { !names.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("${jarFile.name} is missing declared API exports: ${missing}")
        }

        def resources = names.findAll { it.endsWith('.json') || it.endsWith('.toml') || it.endsWith('.mcmeta') }
        if (!resources.isEmpty()) {
            throw new GradleException("${jarFile.name} must be classes only, but carries resources: ${resources.take(20)}")
        }

        logger.lifecycle("verifyApiJar: ${jarFile.name} is a clean compile-only API artifact (${names.count { it.endsWith('.class') }} classes).")
    }
}

/**
 * Spec 21.2's two API-artifact fixtures.
 *
 * `verifyApiJar` asserts the shape of the artifact: which entries are in it, and that it carries no
 * resources. What it cannot do is notice that an exported signature mentions a type that is NOT
 * exported - when this project compiles itself the whole implementation is on the classpath, so the
 * gap only appears in a consumer's build. These two tasks close that, from both directions:
 *
 *  - `verifyApiJarLinks` compiles an outside-style consumer against the produced api jar ALONE plus
 *    the ordinary Forge/Minecraft compile environment. A new signature naming an internal tracker,
 *    policy or mutable record fails here.
 *  - `verifyApiJarLinkage` compiles a consumer against the FROZEN api jar of the previous release and
 *    runs it against the current implementation classes, so a moved record component or a widened
 *    parameter shows up as the NoSuchMethodError a companion would have suffered.
 *
 * The baseline jar is rebuilt from the frozen release commit rather than vendored or taken from
 * build/libs: `mod_version` has not moved yet, so the current apiJar writes to the same file name,
 * and a checked-in binary would be a second copy of an artifact git already holds.
 */
def apiBaselineRef = project.findProperty('apiBaselineRef') ?: 'd1f5dec'
def apiBaselineDir = layout.buildDirectory.dir('apiBaseline')

tasks.register('apiBaselineSources') {
    description = "Extracts the ${apiBaselineRef} main sources for the API linkage fixture."
    outputs.dir(apiBaselineDir.map { it.dir('tree') })
    outputs.upToDateWhen { apiBaselineDir.get().dir('tree/src/main/java').asFile.isDirectory() }
    onlyIf {
        def probe = new ProcessBuilder('git', 'cat-file', '-e', "${apiBaselineRef}^{commit}")
                .directory(projectDir)
                .redirectErrorStream(true)
        probe.redirectOutput(ProcessBuilder.Redirect.DISCARD)
        boolean present = probe.start().waitFor() == 0
        if (!present) {
            logger.lifecycle("apiBaselineSources: commit ${apiBaselineRef} is not in this repository; "
                    + "the API linkage fixture is skipped (override with -PapiBaselineRef=<ref>).")
        }
        present
    }
    doLast {
        def tree = apiBaselineDir.get().dir('tree').asFile
        tree.deleteDir()
        tree.mkdirs()
        def archive = new File(apiBaselineDir.get().asFile, 'baseline-src.tar')
        def export = new ProcessBuilder('git', 'archive', '--format=tar', "${apiBaselineRef}",
                'src/main/java').directory(projectDir)
        export.redirectOutput(archive)
        export.redirectErrorStream(false)
        if (export.start().waitFor() != 0) {
            throw new GradleException("git archive ${apiBaselineRef} failed")
        }
        def extract = new ProcessBuilder('tar', '-xf', archive.absolutePath, '-C', tree.absolutePath)
                .inheritIO()
        if (extract.start().waitFor() != 0) {
            throw new GradleException("extracting the ${apiBaselineRef} sources failed")
        }
    }
}

tasks.register('compileApiBaseline', JavaCompile) {
    description = "Compiles the ${apiBaselineRef} sources so its API jar can be rebuilt exactly."
    dependsOn 'apiBaselineSources'
    onlyIf { tasks.named('apiBaselineSources').get().didWork || source.files.size() > 0 }
    source = fileTree(apiBaselineDir.map { it.dir('tree/src/main/java') }) {
        include '**/*.java'
    }
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = apiBaselineDir.map { it.dir('classes') }
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.register('apiBaselineJar', Jar) {
    description = "The ${apiBaselineRef} compile-only API jar, rebuilt from that commit's sources."
    dependsOn 'compileApiBaseline'
    // Skipped rather than empty when the baseline commit is unavailable: an empty api jar would make
    // the linkage fixture fail with a compile error that says nothing about compatibility.
    onlyIf {
        def classes = apiBaselineDir.get().dir('classes').asFile
        classes.isDirectory() && !fileTree(classes).matching { include '**/*.class' }.isEmpty()
    }
    archiveBaseName = "${mod_id}-baseline"
    archiveClassifier = 'api'
    destinationDirectory = apiBaselineDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(apiBaselineDir.map { it.dir('classes') }) {
        include apiExports
    }
}

/**
 * The outside-consumer compile: the api jar alone, plus Forge and Minecraft. Deliberately not a
 * source set of its own - a source set would put the project's own classes on its compile classpath,
 * which is exactly the leniency this fixture exists to remove.
 */
tasks.register('compileApiJarFixture', JavaCompile) {
    description = 'Compiles a sample consumer against the produced API jar alone.'
    dependsOn 'apiJar'
    source = fileTree('src/apiFixture/java') {
        include '**/*.java'
    }
    classpath = objects.fileCollection().from(
            tasks.named('apiJar', Jar).flatMap { it.archiveFile },
            sourceSets.main.compileClasspath)
    destinationDirectory = layout.buildDirectory.dir('apiFixture/classes')
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.register('verifyApiJarLinks') {
    description = 'Fails when an exported API signature references a type the API jar does not carry.'
    dependsOn 'compileApiJarFixture'
    doLast {
        def classes = layout.buildDirectory.dir('apiFixture/classes').get().asFile
        def compiled = classes.isDirectory() ? fileTree(classes).matching { include '**/*.class' } : files()
        if (compiled.isEmpty()) {
            throw new GradleException('verifyApiJarLinks compiled nothing; the fixture source is missing.')
        }
        logger.lifecycle("verifyApiJarLinks: the sample consumer compiles against "
                + "${tasks.named('apiJar', Jar).get().archiveFile.get().asFile.name} alone "
                + "(${compiled.files.size()} classes).")
    }
}

tasks.register('compileApiLinkageFixture', JavaCompile) {
    description = "Compiles a ${apiBaselineRef}-era consumer against that release's API jar."
    dependsOn 'apiBaselineJar'
    // Gated on the artifact rather than on whether the jar task did work, so an incremental build
    // that finds the baseline jar up to date still recompiles a changed fixture against it.
    onlyIf {
        def jar = tasks.named('apiBaselineJar', Jar).get().archiveFile.get().asFile
        boolean usable = false
        if (jar.isFile()) {
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                usable = zip.entries().any { it.name.endsWith('.class') }
            }
        }
        if (!usable) {
            logger.lifecycle("compileApiLinkageFixture: no usable ${apiBaselineRef} API jar; "
                    + "the binary-linkage fixture is skipped.")
        }
        usable
    }
    source = fileTree('src/apiLinkage/java') {
        include '**/*.java'
    }
    classpath = objects.fileCollection().from(
            tasks.named('apiBaselineJar', Jar).flatMap { it.archiveFile },
            sourceSets.main.compileClasspath)
    destinationDirectory = layout.buildDirectory.dir('apiLinkage/classes')
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.register('verifyApiJarLinkage', JavaExec) {
    description = "Runs the ${apiBaselineRef}-compiled consumer against the current implementation."
    dependsOn 'compileApiLinkageFixture', 'classes'
    onlyIf {
        def classes = layout.buildDirectory.dir('apiLinkage/classes').get().asFile
        boolean compiled = classes.isDirectory()
                && !fileTree(classes).matching { include '**/*.class' }.isEmpty()
        if (!compiled) {
            logger.lifecycle('verifyApiJarLinkage: no baseline-compiled fixture; skipped.')
        }
        compiled
    }
    // The previous release's call sites, resolved against today's classes. No api jar on this
    // classpath: the point is that the implementation still satisfies what that jar promised.
    classpath = objects.fileCollection().from(
            layout.buildDirectory.dir('apiLinkage/classes'),
            sourceSets.main.output,
            sourceSets.main.runtimeClasspath)
    mainClass = 'dev.otectus.mcareputation.fixture.LegacyApiConsumer'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('verifyApiJar').configure {
    finalizedBy 'verifyApiJarLinks', 'verifyApiJarLinkage'
}

tasks.named('check').configure {
    dependsOn 'verifyApiJarLinks'
    dependsOn 'verifyApiJarLinkage'
}

tasks.named('build').configure {
    dependsOn 'checkJarContents'
    dependsOn 'verifyApiJar'
    dependsOn 'verifyApiJarLinks'
    dependsOn 'verifyApiJarLinkage'
}
